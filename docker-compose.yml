services:
  postgres:
    image: postgres:17
    container_name: somine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-somine_db}
      POSTGRES_USER: ${POSTGRES_USER:-somine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - somine-network

  somine-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somine-api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "80:8080"
    volumes:
      - somine_uploads:/app/uploads
      - ./secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    networks:
      - somine-network

volumes:
  postgres_data:
  somine_uploads:

networks:
  somine-network:
    driver: bridge
